name: OpenCart Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      suite:
        description: 'TestNG suite to run'
        required: true
        default: 'master'
        type: choice
        options:
          - master
          - grouping
          - cross-browser
      headed:
        description: 'Run headed (visible browser)'
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: Run OpenCart (${{ github.event.inputs.suite || 'master' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # tutorialsninja.com is Cloudflare-blocked on GitHub-hosted runners
      APP_URL: http://127.0.0.1:8080/
      TEST_EMAIL: ci.user@example.com
      TEST_PASSWORD: CiUser@12345
      HEADLESS: true
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: root
      DB_NAME: opencart

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: opencart
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mysqli, gd, zip, curl, mbstring, xml
          coverage: none

      - name: Install Google Chrome
        run: |
          wget -q -O /tmp/linux_signing_key.pub https://dl.google.com/linux/linux_signing_key.pub
          sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/google-chrome.gpg /tmp/linux_signing_key.pub
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable unzip
          google-chrome --version

      - name: Start OpenCart (official 3.0.3.8)
        run: |
          chmod +x scripts/ci-start-opencart.sh
          ./scripts/ci-start-opencart.sh

      - name: Resolve suite and headless
        id: resolve
        shell: bash
        run: |
          SUITE="${{ github.event.inputs.suite || 'master' }}"
          case "$SUITE" in
            master) XML=master.xml ;;
            grouping) XML=grouping.xml ;;
            cross-browser) XML=CrossBrowserTesting.xml ;;
            *) echo "Unknown suite: $SUITE"; exit 1 ;;
          esac

          if [ "${{ github.event.inputs.headed }}" = "true" ]; then
            echo "HEADLESS=false" >> "$GITHUB_ENV"
          else
            echo "HEADLESS=true" >> "$GITHUB_ENV"
          fi

          echo "suite=$SUITE" >> "$GITHUB_OUTPUT"
          echo "xml=$XML" >> "$GITHUB_OUTPUT"
          echo "APP_URL=$APP_URL"
          echo "Running suite file: $XML"

      - name: Seed CI customer account
        run: mvn -B test -Dsurefire.suiteXmlFiles=seed.xml

      - name: Run tests
        id: tests
        continue-on-error: true
        run: mvn -B test -Dsurefire.suiteXmlFiles=${{ steps.resolve.outputs.xml }}

      - name: Upload Surefire reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ steps.resolve.outputs.suite }}-${{ github.run_id }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Extent reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: extent-reports-${{ steps.resolve.outputs.suite }}-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ steps.resolve.outputs.suite }}-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: OpenCart server log on failure
        if: ${{ failure() || steps.tests.outcome == 'failure' }}
        run: |
          tail -200 .ci-opencart/php-server.log || true
          curl -sSL -D- --max-time 5 "$APP_URL" | head -80 || true

      - name: Fail job if tests failed
        if: ${{ steps.tests.outcome == 'failure' }}
        run: |
          echo "Tests failed. Reports were still uploaded as artifacts."
          exit 1
