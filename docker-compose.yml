# Local OpenCart 3 for CI — tutorialsninja.com is Cloudflare-blocked on GitHub runners
services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: oc
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  opencart:
    image: danelsan/opencart:3.0.4.0
    ports:
      - "8080:80"
    environment:
      # Required: image only runs php cli_install.php when this is true
      OC_INSTALL_NEW: "true"
      OC_URL: http://localhost:8080
      OC_URL_HTTP: http://localhost:8080
      OC_URL_HTTPS: http://localhost:8080
      OC_DB_HOST: db
      OC_DB_USER: root
      OC_DB_PASS: test
      OC_DB_NAME: oc
      OC_DB_PREFIX: oc_
      OC_ADMIN_USER: admin
      OC_ADMIN_PASS: admin123
      OC_ADMIN_EMAIL: admin@example.com
    depends_on:
      db:
        condition: service_healthy
