# Optional local helper only.
# GitHub Actions uses scripts/ci-start-opencart.sh (official OpenCart zip + MySQL service)
# because third-party OpenCart images were unreliable in CI.
services:
  db:
    image: mysql:5.7
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: opencart
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
